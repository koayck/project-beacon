syntax = "proto3";

package beacon;

// Commander → Drone control service
service DroneControl {
  rpc MoveTo        (MoveToRequest)       returns (CommandResponse);
  rpc GetStatus     (StatusRequest)       returns (DroneStatus);
  rpc ReturnToBase  (ReturnRequest)       returns (CommandResponse);
  rpc ScanArea      (ScanAreaRequest)     returns (CommandResponse);
  rpc GetView       (ViewRequest)         returns (ViewResponse);
  rpc SwitchWorld   (SwitchWorldRequest)  returns (CommandResponse);
}

// ── Requests ──────────────────────────────────────────────

message MoveToRequest {
  string asset_id = 1;
  float  x        = 2;
  float  y        = 3;
  float  z        = 4;
  float  speed    = 5;  // units/sec, 0 = use default
}

message StatusRequest {
  string asset_id = 1;
}

message ReturnRequest {
  string asset_id = 1;
}

message ScanAreaRequest {
  string asset_id = 1;
  float  cx       = 2;
  float  cy       = 3;
  float  cz       = 4;
  float  radius   = 5;
}

message ViewRequest {
  string asset_id    = 1;
  float  heading_deg = 2;  // 0 = North, 90 = East; 0 = use last heading
  float  range       = 3;  // detection radius in metres; 0 = use default (20m)
}

message SwitchWorldRequest {
  int32 world_id = 1;  // 1 = world.json, 2 = world2.json
}

// ── Responses ─────────────────────────────────────────────

message CommandResponse {
  bool   success = 1;
  string message = 2;
}

message DroneStatus {
  string asset_id              = 1;
  float  x                     = 2;
  float  y                     = 3;
  float  z                     = 4;
  float  battery               = 5;  // 0.0 – 100.0
  string status                = 6;  // IDLE | MOVING | SCANNING | RETURNING | ERROR
  int64  timestamp_ms          = 7;
  // Lightweight awareness fields (populated from world model)
  int32  nearby_obstacles      = 8;
  float  nearest_obstacle_dist = 9;
  int32  survivors_in_range    = 10;
  bool   over_flood            = 11;
  float  altitude_agl          = 12;
}

message VisibleObject {
  string object_type = 1;   // "building" | "survivor"
  int32  object_id   = 2;
  float  x           = 3;
  float  y           = 4;
  float  z           = 5;
  float  distance    = 6;
  string direction   = 7;   // compass label N/NE/E/…
  string detail      = 8;   // JSON: height, submerged, etc.
}

message ViewResponse {
  string               asset_id              = 1;
  repeated VisibleObject objects             = 2;
  string               terrain              = 3;  // ground | flooded | building_roof | in_building | airspace
  float                altitude_agl         = 4;
  bool                 obstacle_ahead       = 5;
  float                nearest_obstacle_dist = 6;
  int32                nearby_obstacles     = 7;
  int32                survivors_in_range   = 8;
  bool                 over_flood           = 9;
  string               summary             = 10;  // human-readable one-liner for LLM
}

