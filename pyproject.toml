[project]
name = "beacon"
version = "0.1.0"
description = "Offline-first Ground Control Station for autonomous drone swarms"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # gRPC
    "grpcio>=1.68.0",
    "grpcio-tools>=1.68.0",
    # AI / LLM
    "google-adk>=1.0.0",
    "litellm>=1.50.0",
    "fastmcp>=2.0.0",
    # Database
    "aiosqlite>=0.20.0",
    # Validation
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "google-genai>=1.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
