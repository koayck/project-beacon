version: "3.9"

# Simulated MANET — each service is an isolated drone node on the beacon-net bridge.
# The host machine (commander node) reaches each drone via the exposed gRPC ports.
# UDP telemetry is broadcast to 255.255.255.255; the host receives it via the bridge interface.

networks:
  beacon-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  beacon-01:
    build:
      context: .
      dockerfile: drone-sim/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASSET_ID=BEACON-01
      - GRPC_PORT=50051
      - TELEMETRY_HOST=host.docker.internal
      - PYTHONUNBUFFERED=1
    networks:
      beacon-net:
        ipv4_address: 172.28.0.11
    ports:
      - "50051:50051"  # gRPC exposed to host

  beacon-02:
    build:
      context: .
      dockerfile: drone-sim/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASSET_ID=BEACON-02
      - GRPC_PORT=50051
      - TELEMETRY_HOST=host.docker.internal
      - PYTHONUNBUFFERED=1
    networks:
      beacon-net:
        ipv4_address: 172.28.0.12
    ports:
      - "50052:50051"

  beacon-03:
    build:
      context: .
      dockerfile: drone-sim/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASSET_ID=BEACON-03
      - GRPC_PORT=50051
      - TELEMETRY_HOST=host.docker.internal
      - PYTHONUNBUFFERED=1
      - INITIAL_BATTERY=12
    networks:
      beacon-net:
        ipv4_address: 172.28.0.13
    ports:
      - "50053:50051"

  beacon-04:
    build:
      context: .
      dockerfile: drone-sim/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASSET_ID=BEACON-04
      - GRPC_PORT=50051
      - TELEMETRY_HOST=host.docker.internal
      - PYTHONUNBUFFERED=1
    networks:
      beacon-net:
        ipv4_address: 172.28.0.14
    ports:
      - "50054:50051"

  beacon-05:
    build:
      context: .
      dockerfile: drone-sim/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASSET_ID=BEACON-05
      - GRPC_PORT=50051
      - TELEMETRY_HOST=host.docker.internal
      - PYTHONUNBUFFERED=1
    networks:
      beacon-net:
        ipv4_address: 172.28.0.15
    ports:
      - "50055:50051"

  beacon-scout:
    build:
      context: .
      dockerfile: drone-sim/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ASSET_ID=BEACON-SCOUT
      - GRPC_PORT=50051
      - TELEMETRY_HOST=host.docker.internal
      - PYTHONUNBUFFERED=1
    networks:
      beacon-net:
        ipv4_address: 172.28.0.16
    ports:
      - "50056:50051"
