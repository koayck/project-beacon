services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: beacon-backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      # OLLAMA_HOST: "host.docker.internal:11434"  # Adjust if running Ollama
    volumes:
      - ./shared:/app/shared:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - beacon
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: beacon-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - beacon
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"

networks:
  beacon:
    driver: bridge
